name: Build Unsigned iOS IPA
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Expo Prebuild
        working-directory: mobile
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install

      - name: Build Unsigned App
        working-directory: mobile/ios
        run: |
          xcodebuild -workspace mobile.xcworkspace -scheme mobile -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        working-directory: mobile/ios
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/mobile.app Payload/
          zip -r CricCoach.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CricCoach-IPA
          path: mobile/ios/CricCoach.ipa
